fragment LayoutFields on DashboardLayout {
  pageKey
  version
  updatedAt
  items { id type x y w h tabs pinned config { title accent spaceId limit includeClosed mine priorities fields categories chart breakdownChart assigneeIds followContext } }
}

query MyLayout($workspaceId: ID!, $pageKey: String!) { myLayout(workspaceId: $workspaceId, pageKey: $pageKey) { ...LayoutFields } }

mutation SaveLayout($workspaceId: ID!, $input: SaveLayoutInput!) { saveLayout(workspaceId: $workspaceId, input: $input) { ...LayoutFields } }

mutation ResetLayout($workspaceId: ID!, $pageKey: String!) { resetLayout(workspaceId: $workspaceId, pageKey: $pageKey) }

fragment NamedDashboardFields on NamedDashboard {
  id
  name
  visibility
  ownerId
  spaceId
  mine
  version
  period
  departmentId
  departmentName
  updatedAt
  items { id type x y w h tabs pinned config { title accent spaceId limit includeClosed mine priorities fields categories chart breakdownChart assigneeIds followContext } }
}

query Dashboards($workspaceId: ID!, $spaceId: ID) { dashboards(workspaceId: $workspaceId, spaceId: $spaceId) { ...NamedDashboardFields } }

query DashboardTeams($workspaceId: ID!) { dashboardTeams(workspaceId: $workspaceId) { id name } }

mutation CreateDashboard($workspaceId: ID!, $input: CreateDashboardInput!) { createDashboard(workspaceId: $workspaceId, input: $input) { ...NamedDashboardFields } }

mutation UpdateDashboard($workspaceId: ID!, $dashboardId: ID!, $input: UpdateDashboardInput!) {
  updateDashboard(workspaceId: $workspaceId, dashboardId: $dashboardId, input: $input) { ...NamedDashboardFields }
}

mutation SaveDashboardLayout($workspaceId: ID!, $dashboardId: ID!, $input: SaveDashboardLayoutInput!) {
  saveDashboardLayout(workspaceId: $workspaceId, dashboardId: $dashboardId, input: $input) { ...NamedDashboardFields }
}

mutation DeleteDashboard($workspaceId: ID!, $dashboardId: ID!) { deleteDashboard(workspaceId: $workspaceId, dashboardId: $dashboardId) }

query MyLayoutVersions($workspaceId: ID!, $pageKey: String!) {
  myLayoutVersions(workspaceId: $workspaceId, pageKey: $pageKey) { version savedAt items { id type x y w h tabs pinned config { title accent spaceId limit includeClosed mine priorities fields categories chart breakdownChart assigneeIds followContext } } }
}

query WorkspaceLayout($workspaceId: ID!, $pageKey: String!) {
  workspaceLayout(workspaceId: $workspaceId, pageKey: $pageKey) { pageKey updatedAt updatedByName locked items { id type x y w h tabs pinned config { title accent spaceId limit includeClosed mine priorities fields categories chart breakdownChart assigneeIds followContext } } }
}

mutation SetWorkspaceLayout($workspaceId: ID!, $input: SetWorkspaceLayoutInput!) {
  setWorkspaceLayout(workspaceId: $workspaceId, input: $input) { pageKey updatedAt updatedByName locked items { id } }
}

mutation ClearWorkspaceLayout($workspaceId: ID!, $pageKey: String!) { clearWorkspaceLayout(workspaceId: $workspaceId, pageKey: $pageKey) }

mutation SetWorkspaceLayoutLocked($workspaceId: ID!, $pageKey: String!, $locked: Boolean!) {
  setWorkspaceLayoutLocked(workspaceId: $workspaceId, pageKey: $pageKey, locked: $locked) { pageKey locked }
}

query MyTeamLayout($workspaceId: ID!, $pageKey: String!) {
  myTeamLayout(workspaceId: $workspaceId, pageKey: $pageKey) { departmentId departmentName pageKey updatedAt updatedByName items { id type x y w h tabs pinned config { title accent spaceId limit includeClosed mine priorities fields categories chart breakdownChart assigneeIds followContext } } }
}

query TeamLayoutTargets($workspaceId: ID!, $pageKey: String!) {
  teamLayoutTargets(workspaceId: $workspaceId, pageKey: $pageKey) { departmentId name hasDefault }
}

mutation SetTeamLayout($workspaceId: ID!, $input: SetTeamLayoutInput!) {
  setTeamLayout(workspaceId: $workspaceId, input: $input) { departmentId name hasDefault }
}

mutation ClearTeamLayout($workspaceId: ID!, $departmentId: ID!, $pageKey: String!) {
  clearTeamLayout(workspaceId: $workspaceId, departmentId: $departmentId, pageKey: $pageKey)
}

query DashboardVersions($workspaceId: ID!, $dashboardId: ID!) {
  dashboardVersions(workspaceId: $workspaceId, dashboardId: $dashboardId) { version savedAt items { id type x y w h tabs pinned config { title accent spaceId limit includeClosed mine priorities fields categories chart breakdownChart assigneeIds followContext } } }
}
