fragment GithubConnectionFields on GithubConnection {
  id
  repo
  taskPrefix
  sync { onOpened onMerged onClosed }
  webhookPath
  createdById
  lastDeliveryAt
  lastDeliveryStatus
  createdAt
}

query GithubConnections($workspaceId: ID!) { githubConnections(workspaceId: $workspaceId) { ...GithubConnectionFields } }

query TaskPullRequests($workspaceId: ID!, $taskId: ID!) {
  taskPullRequests(workspaceId: $workspaceId, taskId: $taskId) { id taskId repo number title url state author branch updatedAt }
}

mutation ConnectGithub($workspaceId: ID!, $input: ConnectGithubInput!) {
  connectGithub(workspaceId: $workspaceId, input: $input) { webhookSecret connection { ...GithubConnectionFields } }
}

mutation UpdateGithubConnection($workspaceId: ID!, $connectionId: ID!, $input: UpdateGithubConnectionInput!) {
  updateGithubConnection(workspaceId: $workspaceId, connectionId: $connectionId, input: $input) { ...GithubConnectionFields }
}

mutation RotateGithubSecret($workspaceId: ID!, $connectionId: ID!) {
  rotateGithubSecret(workspaceId: $workspaceId, connectionId: $connectionId) { webhookSecret connection { ...GithubConnectionFields } }
}

mutation DisconnectGithub($workspaceId: ID!, $connectionId: ID!) { disconnectGithub(workspaceId: $workspaceId, connectionId: $connectionId) }

query GithubSyncLog($workspaceId: ID!, $connectionId: ID!) {
  githubSyncLog(workspaceId: $workspaceId, connectionId: $connectionId) { id connectionId event outcome detail prNumber taskNumbers createdAt }
}

query GithubPullRequestInbox($workspaceId: ID!) {
  githubPullRequestInbox(workspaceId: $workspaceId) { id connectionId repo number title url author branch state updatedAt }
}

mutation LinkInboxPullRequest($workspaceId: ID!, $itemId: ID!, $taskNumber: Int!) {
  linkInboxPullRequest(workspaceId: $workspaceId, itemId: $itemId, taskNumber: $taskNumber) { id number }
}

mutation DismissInboxPullRequest($workspaceId: ID!, $itemId: ID!) { dismissInboxPullRequest(workspaceId: $workspaceId, itemId: $itemId) }

query GithubConflicts($workspaceId: ID!, $taskId: ID!) {
  githubConflicts(workspaceId: $workspaceId, taskId: $taskId) { id taskId prNumber prTitle prUrl event wantedStatus { id name color } createdAt }
}

mutation ResolveGithubConflict($workspaceId: ID!, $conflictId: ID!, $useGithub: Boolean!) {
  resolveGithubConflict(workspaceId: $workspaceId, conflictId: $conflictId, useGithub: $useGithub) { id status { id name } }
}
