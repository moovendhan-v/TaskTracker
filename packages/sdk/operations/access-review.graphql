fragment AccessExplanationFields on AccessExplanation {
  userId
  roleName
  permission
  spaceId
  allowed
  verdict
  reasons { effect source pattern scope }
}

query ExplainAccess($workspaceId: ID!, $userId: ID!, $permission: String!, $spaceId: ID) {
  explainAccess(workspaceId: $workspaceId, userId: $userId, permission: $permission, spaceId: $spaceId) { ...AccessExplanationFields }
}

query ExplainMyAccess($workspaceId: ID!, $permission: String!, $spaceId: ID) {
  explainMyAccess(workspaceId: $workspaceId, permission: $permission, spaceId: $spaceId) { ...AccessExplanationFields }
}

mutation RequestAccess($workspaceId: ID!, $input: RequestAccessInput!) { requestAccess(workspaceId: $workspaceId, input: $input) }

query AccessRequests($workspaceId: ID!) { accessRequests(workspaceId: $workspaceId) { id requesterId requesterName permission spaceId spaceName note status createdAt } }

query AccessGrants($workspaceId: ID!) { accessGrants(workspaceId: $workspaceId) { id userId userName permission spaceId spaceName expiresAt grantedByName createdAt } }

mutation DecideAccessRequest($workspaceId: ID!, $requestId: ID!, $approve: Boolean!, $days: Int) {
  decideAccessRequest(workspaceId: $workspaceId, requestId: $requestId, approve: $approve, days: $days) { id status }
}

mutation RevokeAccessGrant($workspaceId: ID!, $grantId: ID!) { revokeAccessGrant(workspaceId: $workspaceId, grantId: $grantId) }
