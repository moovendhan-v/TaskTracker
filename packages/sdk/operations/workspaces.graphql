query Workspaces { workspaces { ...WorkspaceFields } }

query Workspace($workspaceId: ID!) { workspace(workspaceId: $workspaceId) { ...WorkspaceFields } }

mutation CreateWorkspace($input: CreateWorkspaceInput!) { createWorkspace(input: $input) { ...WorkspaceFields } }

mutation UpdateWorkspace($workspaceId: ID!, $input: UpdateWorkspaceInput!) {
  updateWorkspace(workspaceId: $workspaceId, input: $input) { ...WorkspaceFields }
}

mutation DeleteWorkspace($workspaceId: ID!) { deleteWorkspace(workspaceId: $workspaceId) }
query TwoStepPolicy($workspaceId: ID!) { twoStepPolicy(workspaceId: $workspaceId) { id workspaceId require callerHasTwoStep } }
mutation SetTwoStepRequirement($workspaceId: ID!, $require: String!) { setTwoStepRequirement(workspaceId: $workspaceId, require: $require) { id workspaceId require callerHasTwoStep } }
