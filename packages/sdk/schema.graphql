  joinedAt: String!
  name: String!
  roleId: ID!
  roleName: String!
  userId: ID!
}

type MemberPage {
  items: [Member!]!
  page: Int!
  pageSize: Int!
  total: Int!
}

"""
Flat key/value data: up to 50 keys, values are text, numbers, booleans or null
"""
scalar Metadata

input MoveFolderInput {
  """Null: directly under the space"""
  parentId: ID
  position: Float
}

input MoveTaskListInput {
  """Null: directly under the space"""
  folderId: ID
  position: Float
}

type Mutation {
  addChatChannelMembers(channelId: ID!, userIds: [ID!]!, workspaceId: ID!): [ChatMember!]!

  """Adds a step at the end of the task checklist"""
  addChecklistItem(taskId: ID!, title: String!, workspaceId: ID!): ChecklistItem!
  addMember(input: AddMemberInput!, workspaceId: ID!): AddMemberResult!
  addOrganizationMember(email: String!, organizationId: ID!, role: String!): [OrganizationMember!]!

  """Needs workspace.manage here and owner or admin in the organization"""
  addWorkspaceToOrganization(organizationId: ID!, workspaceId: ID!): Boolean!
  archiveChatChannel(archived: Boolean! = true, channelId: ID!, workspaceId: ID!): ChatChannel!
  attachRolePolicy(
    """managed:<key> or a custom policy id"""
    policy: String!
    roleId: ID!
    workspaceId: ID!
  ): Role!
  cancelLeaveRequest(requestId: ID!, workspaceId: ID!): LeaveRequest!

  """
  Tells the channel you are typing. A live signal only; nothing is stored
  """
  chatTyping(channelId: ID!, workspaceId: ID!): Boolean!

  """
  Removes a team's default for a page (layout managers or the team's head; audited)
  """
  clearTeamLayout(departmentId: ID!, pageKey: String!, workspaceId: ID!): Boolean!

  """
  Back to the built-in default for everyone who has not arranged the page (audited)
  """
  clearWorkspaceLayout(pageKey: String!, workspaceId: ID!): Boolean!
  clockIn(workspaceId: ID!): AttendanceShift!

  """Ends your shift, and a running break with it"""
  clockOut(workspaceId: ID!): AttendanceShift!

  """
  Checks an uploaded file (size, real type). Files that fail are deleted and the reason returned
  """
  completeChatUpload(attachmentId: ID!, workspaceId: ID!): ChatUploadResult!

  """
  Unfinished tasks move to another planned sprint in the space, or to the backlog when omitted
  """
  completeSprint(
    moveOpenTasksToSprintId: ID

    """Per-task destinations for unfinished tasks"""
    rollover: CompleteSprintMovesInput
    sprintId: ID!
    workspaceId: ID!
  ): Sprint!

  """
  Checks an uploaded file (size, real type). Files that fail are deleted and the reason returned
  """
  completeTaskUpload(attachmentId: ID!, workspaceId: ID!): TaskUploadResult!
  connectGithub(input: ConnectGithubInput!, workspaceId: ID!): GithubSecret!

  """Connects a repository through the app; linked tasks are moved as you"""
  connectGithubRepository(input: ConnectGithubRepositoryInput!, workspaceId: ID!): GithubConnection!
  createAutomation(input: SaveAutomationInput!, spaceId: ID!, workspaceId: ID!): AutomationRule!
  createChatChannel(input: CreateChatChannelInput!, workspaceId: ID!): ChatChannel!
  createComment(input: CommentInput!, taskId: ID!, workspaceId: ID!): Comment!
  createCustomField(input: CreateCustomFieldInput!, workspaceId: ID!): CustomField!
  createDashboard(input: CreateDashboardInput!, workspaceId: ID!): NamedDashboard!
  createDepartment(input: CreateDepartmentInput!, workspaceId: ID!): Department!
  createDocument(input: CreateDocumentInput!, workspaceId: ID!): Document!
  createFolder(input: CreateFolderInput!, spaceId: ID!, workspaceId: ID!): Folder!

  """
  Opens a GitHub issue for the task and links them (needs edit rights on the task)
  """
  createGithubIssue(connectionId: ID!, taskId: ID!, workspaceId: ID!): GithubIssueLink!
  createLeaveType(input: CreateLeaveTypeInput!, workspaceId: ID!): LeaveType!
  createList(input: TaskListInput!, spaceId: ID!, workspaceId: ID!): TaskList!
  createOrganization(name: String!): Organization!
  createPolicy(input: SavePolicyInput!, workspaceId: ID!): Policy!
  createRole(input: CreateRoleInput!, workspaceId: ID!): Role!
  createSpace(input: CreateSpaceInput!, workspaceId: ID!): Space!

  """Creates a space from a template"""
  createSpaceFromTemplate(
    input: CreateFromTemplateInput!

    """builtin:<key> or a template id"""
    templateId: String!
    workspaceId: ID!
  ): Space!
  createSprint(input: CreateSprintInput!, spaceId: ID!, workspaceId: ID!): Sprint!
  createStatus(input: CreateTaskStatusInput!, spaceId: ID!, workspaceId: ID!): TaskStatus!
  createTask(input: CreateTaskInput!, listId: ID!, workspaceId: ID!): Task!

  """
  Creates a task from a message (needs task.create on the list) and notes it in the thread
  """
  createTaskFromChatMessage(input: CreateTaskFromMessageInput!, workspaceId: ID!): ChatMessage!

  """
  Creates a task in a space's first list, adding a list if the space has none
  """
  createTaskInSpace(input: CreateTaskInput!, spaceId: ID!, workspaceId: ID!): Task!
  createWorkspace(input: CreateWorkspaceInput!): Workspace!

  """
  Approves a request for 1, 7 or 30 days (as a grant that ends), or declines it. Only for access you have yourself
  """
  decideAccessRequest(approve: Boolean!, days: Int, requestId: ID!, workspaceId: ID!): AccessRequest!

  """Approvers cannot decide on their own requests"""
  decideLeaveRequest(input: DecideLeaveInput!, requestId: ID!, workspaceId: ID!): LeaveRequest!
  deleteAutomation(ruleId: ID!, workspaceId: ID!): Boolean!
  deleteChatMessage(messageId: ID!, workspaceId: ID!): Boolean!
  deleteChecklistItem(itemId: ID!, workspaceId: ID!): Boolean!

  """The author, or anyone with task.delete"""
  deleteComment(commentId: ID!, workspaceId: ID!): Boolean!

  """Deletes the field and its values everywhere"""
  deleteCustomField(fieldId: ID!, workspaceId: ID!): Boolean!
  deleteDashboard(dashboardId: ID!, workspaceId: ID!): Boolean!
  deleteDepartment(departmentId: ID!, workspaceId: ID!): Boolean!

  """Sub-pages are deleted too"""
  deleteDocument(documentId: ID!, workspaceId: ID!): Boolean!

  """Deletes the folder only; its lists and sub-folders move up a level"""
  deleteFolder(folderId: ID!, workspaceId: ID!): Boolean!
  deleteLeaveType(leaveTypeId: ID!, workspaceId: ID!): Boolean!
  deleteList(listId: ID!, workspaceId: ID!): Boolean!

  """Owners only; its workspaces stay, on their own"""
  deleteOrganization(organizationId: ID!): Boolean!
  deletePolicy(policyId: ID!, workspaceId: ID!): Boolean!
  deleteRole(roleId: ID!, workspaceId: ID!): Boolean!
  deleteSpace(spaceId: ID!, workspaceId: ID!): Boolean!
  deleteSprint(sprintId: ID!, workspaceId: ID!): Boolean!

  """Deletes a status; its tasks move to `moveTasksTo` in the same space"""
  deleteStatus(moveTasksTo: ID!, statusId: ID!, workspaceId: ID!): Boolean!

  """Deletes the task and its subtasks"""
  deleteTask(taskId: ID!, workspaceId: ID!): Boolean!

  """
  Removes a file: its uploader, or someone who may delete tasks in that space
  """
  deleteTaskAttachment(attachmentId: ID!, workspaceId: ID!): Boolean!
  deleteTemplate(templateId: ID!, workspaceId: ID!): Boolean!
  deleteTimeEntry(entryId: ID!, workspaceId: ID!): Boolean!
  deleteView(viewId: ID!): Preferences!
  deleteWorkspace(workspaceId: ID!): Boolean!
  detachRolePolicy(
    """managed:<key> or a custom policy id"""
    policy: String!
    roleId: ID!
    workspaceId: ID!
  ): Role!

  """Removes a file you added but haven't sent"""
  discardChatUpload(attachmentId: ID!, workspaceId: ID!): Boolean!
  disconnectGithub(connectionId: ID!, workspaceId: ID!): Boolean!
  dismissInboxPullRequest(itemId: ID!, workspaceId: ID!): Boolean!
  editChatMessage(body: String!, messageId: ID!, workspaceId: ID!): ChatMessage!
  endBreak(workspaceId: ID!): AttendanceShift!

  """Downloads a channel's history you can read (Markdown or JSON). Audited"""
  exportChatChannel(
    channelId: ID!

    """markdown or json"""
    format: String! = "markdown"
    workspaceId: ID!
  ): ChatExport!

  """
  Where to send you to install the app on GitHub for this workspace; the link works for ten minutes, for you only
  """
  githubAppInstallUrl(workspaceId: ID!): String!

  """Adds a template from an exported JSON file"""
  importTemplate(input: ImportTemplateInput!, workspaceId: ID!): ProjectTemplate!

  """Joins the channel's call, starting one if none is going"""
  joinCall(channelId: ID!, workspaceId: ID!): CallJoin!
  joinChatChannel(channelId: ID!, workspaceId: ID!): ChatChannel!
  leaveChatChannel(channelId: ID!, workspaceId: ID!): Boolean!

  """Leaving the office page: you show as offline at once"""
  leaveOffice(workspaceId: ID!): Boolean!

  """Leave a workspace. The last owner cannot leave."""
  leaveWorkspace(workspaceId: ID!): Boolean!

  """
  Links an inbox pull request to a task by number (you must be able to edit the task)
  """
  linkInboxPullRequest(itemId: ID!, taskNumber: Int!, workspaceId: ID!): GithubInboxPullRequest!
  logTime(input: LogTimeInput!, workspaceId: ID!): TimeEntry!

  """
  Saves a daily log: several entries, all or none, at most 24 hours in total
  """
  logTimeBatch(input: LogTimeBatchInput!, workspaceId: ID!): [TimeEntry!]!

  """Returns how many were unread"""
  markAllNotificationsRead(workspaceId: ID!): Int!

  """Marks the channel read up to this time (never moves backwards)"""
  markChatChannelRead(at: String!, channelId: ID!, workspaceId: ID!): Boolean!

  """Returns how many were unread"""
  markNotificationsRead(ids: [ID!]!, workspaceId: ID!): Int!

  """
  Moves a step before another (or to the end); returns the checklist in its new order
  """
  moveChecklistItem(
    """The step it goes before; omit for the end"""
    beforeId: ID
    itemId: ID!
    workspaceId: ID!
  ): [ChecklistItem!]!

  """parentId null moves the page to the top level"""
  moveDocument(
    documentId: ID!
    parentId: ID
    position: Float

    """For a top-level page: its space (null: none, omitted: unchanged)"""
    spaceId: ID
    workspaceId: ID!
  ): Document!
  moveFolder(folderId: ID!, input: MoveFolderInput!, workspaceId: ID!): Folder!
  moveInOffice(workspaceId: ID!, x: Int!, y: Int!): OfficePerson!

  """Moves a list into a folder of its project, or out of it"""
  moveList(input: MoveTaskListInput!, listId: ID!, workspaceId: ID!): TaskList!
  muteChatChannel(channelId: ID!, muted: Boolean!, workspaceId: ID!): Boolean!

  """A sign of life from the open office page, every minute"""
  officeHeartbeat(workspaceId: ID!): OfficePerson!

  """A meeting room's channel (made the first time someone goes in)"""
  officeMeetingRoom(workspaceId: ID!, zoneId: String!): ID!

  """Finds or starts the direct message between you and these people"""
  openDirectMessage(userIds: [ID!]!, workspaceId: ID!): ChatChannel!
  relateTasks(kind: TaskRelationKind!, relatedTaskId: ID!, taskId: ID!, workspaceId: ID!): [TaskRelation!]!
  removeChatChannelMember(channelId: ID!, userId: ID!, workspaceId: ID!): Boolean!

  """
  Forgets an installation here, with its repositories; it stays installed on GitHub
  """
  removeGithubInstallation(installationId: ID!, workspaceId: ID!): Boolean!
  removeMember(userId: ID!, workspaceId: ID!): Boolean!

  """Owners and admins remove people; anyone can remove themselves (leave)"""
  removeOrganizationMember(organizationId: ID!, userId: String!): [OrganizationMember!]!
  removeOrganizationSso(organizationId: ID!): Boolean!
  removeWorkspaceFromOrganization(workspaceId: ID!): Boolean!
  renameOrganization(name: String!, organizationId: ID!): Organization!
  reorderStatuses(spaceId: ID!, statusIds: [ID!]!, workspaceId: ID!): [TaskStatus!]!

  """
  Asks the people who manage roles for access; returns how many were asked
  """
  requestAccess(input: RequestAccessInput!, workspaceId: ID!): Int!

  """Starts a file upload: returns a short-lived URL to PUT the bytes to"""
  requestChatUpload(input: RequestChatUploadInput!, workspaceId: ID!): ChatUploadTicket!
  requestLeave(input: RequestLeaveInput!, workspaceId: ID!): LeaveRequest!

  """
  Starts a file upload to a task: returns a short-lived URL to PUT the bytes to
  """
  requestTaskUpload(input: RequestTaskUploadInput!, workspaceId: ID!): TaskUploadTicket!

  """
  Drops your own layout for a page: you're back on the workspace default, or the built-in one
  """
  resetLayout(pageKey: String!, workspaceId: ID!): Boolean!

  """Back to the default settings"""
  resetPreferences: Preferences!
  resetTableLayout(key: String!): Preferences!

  """
  Settles a conflict: useGithub moves the task to GitHub's status, otherwise it stays as it is. Needs edit rights on the task
  """
  resolveGithubConflict(conflictId: ID!, useGithub: Boolean!, workspaceId: ID!): Task!

  """
  The secret this automation signs webhook calls with. Audited; rotate makes a new one
  """
  revealAutomationWebhookSecret(rotate: Boolean! = false, ruleId: ID!, workspaceId: ID!): String!

  """Ends a grant early"""
  revokeAccessGrant(grantId: ID!, workspaceId: ID!): Boolean!

  """A new webhook secret; the old one stops working at once"""
  rotateGithubSecret(connectionId: ID!, workspaceId: ID!): GithubSecret!

  """
  Saves the blocks of one of your dashboards. Fails with CONFLICT if it changed since baseVersion
  """
  saveDashboardLayout(dashboardId: ID!, input: SaveDashboardLayoutInput!, workspaceId: ID!): NamedDashboard!

  """Saves your layout. Fails with CONFLICT if it changed since baseVersion"""
  saveLayout(input: SaveLayoutInput!, workspaceId: ID!): DashboardLayout!
  saveSpaceAsTemplate(input: SaveAsTemplateInput!, spaceId: ID!, workspaceId: ID!): ProjectTemplate!

  """Saves how a table is arranged (columns, widths, paging)"""
  saveTableLayout(input: TableLayoutInput!): Preferences!

  """Creates or updates a saved view (a named set of filters)"""
  saveView(input: SaveViewInput!): Preferences!
  sendChatMessage(input: SendChatMessageInput!, workspaceId: ID!): ChatMessage!
  setAutomationEnabled(enabled: Boolean!, ruleId: ID!, workspaceId: ID!): AutomationRule!

  """Make someone an owner, or a plain member again"""
  setChatChannelMemberRole(channelId: ID!, role: String!, userId: ID!, workspaceId: ID!): [ChatMember!]!
  setChatRetention(days: Int, workspaceId: ID!): ChatRetention!
  setOfficeStatus(status: String!, workspaceId: ID!): OfficePerson!
  setOrganizationMemberRole(organizationId: ID!, role: String!, userId: String!): [OrganizationMember!]!

  """Owners, with two-step sign-in; replaces any SSO it had"""
  setOrganizationSso(input: OrganizationSsoInput!, organizationId: ID!): OrganizationSso

  """Two-step sign-in required in all its workspaces"""
  setOrganizationTwoStep(organizationId: ID!, require: String!): Organization!

  """
  Replaces a role's inline policy (statements that belong to that role only)
  """
  setRoleInlinePolicy(document: PolicyDocumentInput!, roleId: ID!, workspaceId: ID!): Role!

  """Sets a space's custom field values; a value of null clears it"""
  setSpaceCustomFields(spaceId: ID!, values: CustomFieldValues!, workspaceId: ID!): Space!

  """Replaces the open tabs of the multi-tab workspace"""
  setTabs(input: SetTabsInput!): Preferences!

  """
  Makes a layout a team's starting point for a page (layout managers or the team's head; audited)
  """
  setTeamLayout(input: SetTeamLayoutInput!, workspaceId: ID!): TeamLayoutTarget!
  setTwoStepRequirement(require: String!, workspaceId: ID!): TwoStepPolicy!

  """Makes a layout the workspace default for a page (audited)"""
  setWorkspaceLayout(input: SetWorkspaceLayoutInput!, workspaceId: ID!): WorkspaceLayout!

  """
  Locks the workspace default: everyone sees it, and only layout managers arrange the page (audited)
  """
  setWorkspaceLayoutLocked(locked: Boolean!, pageKey: String!, workspaceId: ID!): WorkspaceLayout!

  """
  Snoozes your notifications until a time (they come back unread), or brings them back now without `until`. Returns how many changed
  """
  snoozeNotifications(
    ids: [ID!]!

    """
    When they come back (ISO time, at most 30 days ahead); omit to unsnooze now
    """
    until: String
    workspaceId: ID!
  ): Int!
  startBreak(workspaceId: ID!): AttendanceShift!
  startSprint(sprintId: ID!, workspaceId: ID!): Sprint!

  """Starts a timer; a timer already running is stopped first"""
  startTimer(input: StartTimerInput!, workspaceId: ID!): TimeEntry!
  stopTimer(workspaceId: ID!): TimeEntry!

  """Adds your reaction, or removes it if it is already there"""
  toggleChatReaction(emoji: String!, messageId: ID!, workspaceId: ID!): ChatMessage!
  unrelateTasks(relationId: ID!, workspaceId: ID!): Boolean!

  """
  Suspending signs the user out everywhere. You cannot change your own account.
  """
  updateAdminUser(input: UpdateAdminUserInput!, userId: ID!): AdminUser!

  """Saving takes the rule over: it then runs as you"""
  updateAutomation(input: SaveAutomationInput!, ruleId: ID!, workspaceId: ID!): AutomationRule!
  updateChatChannel(channelId: ID!, input: UpdateChatChannelInput!, workspaceId: ID!): ChatChannel!

  """Renames a step, or ticks / unticks it"""
  updateChecklistItem(input: UpdateChecklistItemInput!, itemId: ID!, workspaceId: ID!): ChecklistItem!

  """Only the author can edit"""
  updateComment(commentId: ID!, input: CommentInput!, workspaceId: ID!): Comment!
  updateCustomField(fieldId: ID!, input: UpdateCustomFieldInput!, workspaceId: ID!): CustomField!

  """
  Rename, share / unshare, or set the date range of one of your dashboards
  """
  updateDashboard(dashboardId: ID!, input: UpdateDashboardInput!, workspaceId: ID!): NamedDashboard!
  updateDepartment(departmentId: ID!, input: UpdateDepartmentInput!, workspaceId: ID!): Department!
  updateDocument(documentId: ID!, input: UpdateDocumentInput!, workspaceId: ID!): Document!
  updateFolder(folderId: ID!, input: UpdateFolderInput!, workspaceId: ID!): Folder!

  """Saving takes the connection over: tasks are then moved as you"""
  updateGithubConnection(connectionId: ID!, input: UpdateGithubConnectionInput!, workspaceId: ID!): GithubConnection!
  updateLeaveType(input: UpdateLeaveTypeInput!, leaveTypeId: ID!, workspaceId: ID!): LeaveType!
  updateList(input: UpdateTaskListInput!, listId: ID!, workspaceId: ID!): TaskList!
  updateMemberRole(roleId: ID!, userId: ID!, workspaceId: ID!): Member!
  updatePolicy(input: SavePolicyInput!, policyId: ID!, workspaceId: ID!): Policy!
  updatePreferences(input: UpdatePreferencesInput!): Preferences!
  updateRole(input: UpdateRoleInput!, roleId: ID!, workspaceId: ID!): Role!
  updateSpace(input: UpdateSpaceInput!, spaceId: ID!, workspaceId: ID!): Space!
  updateSprint(input: UpdateSprintInput!, sprintId: ID!, workspaceId: ID!): Sprint!
  updateStatus(input: UpdateTaskStatusInput!, statusId: ID!, workspaceId: ID!): TaskStatus!
  updateTask(input: UpdateTaskInput!, taskId: ID!, workspaceId: ID!): Task!

  """Your own entries need time.log; anyone else's need time.manage"""
  updateTimeEntry(entryId: ID!, input: UpdateTimeEntryInput!, workspaceId: ID!): TimeEntry!
  updateWorkspace(input: UpdateWorkspaceInput!, workspaceId: ID!): Workspace!
  upsertEmployeeProfile(input: EmployeeProfileInput!, userId: ID!, workspaceId: ID!): Employee!

  """Checks the DNS record that proves the domain"""
  verifyOrganizationSsoDomain(organizationId: ID!): OrganizationSso

  """Follow (true) or stop following (false) a task"""
  watchTask(taskId: ID!, watching: Boolean!, workspaceId: ID!): [ID!]!
}

type MyAccess {
  permissions: [String!]!
  readableFields: [String!]!
  spaceRules: [SpaceRule!]!

  """
  Some permissions are held back until the caller sets up two-step sign-in
  """
  twoStepMissing: Boolean!
}

type MyAttendance {
  current: AttendanceShift
  recent: [AttendanceShift!]!
}

"""
A Home dashboard tab: private to its owner, shared with one department (a team) or with the workspace
"""
type NamedDashboard {
  """
  The team it is shared with (visibility "department"); null if that department was deleted
  """
  departmentId: ID
  departmentName: String
  id: ID!
  items: [LayoutItem!]!

  """You own it, so you can edit, share or delete it"""
  mine: Boolean!
  name: String!
  ownerId: ID!

  """
  The date range it opens with (this_week, last_30, …); null for the page’s own
  """
  period: String
  updatedAt: String!
  version: Int!
  visibility: String!
}

type Notification {
  actorId: ID
  actorName: String
  createdAt: String!
  entityId: ID!
  entityType: String!

  """Plain text; render as text, never HTML"""
  excerpt: String!
  id: ID!
  kind: NotificationKind!
  readAt: String

  """Hidden until then, when it comes back unread"""
  snoozedUntil: String

  """What it is about, e.g. the task title"""
  subject: String!

  """The task to open, when the notification is about one"""
  taskId: ID
}

enum NotificationKind {
  access_decided
  access_requested
  automation
  chat_mention
  comment_mention
  leave_decided
  leave_requested
  member_added
  task_assigned
  task_commented
}

type NotificationPage {
  items: [Notification!]!
  page: Int!
  pageSize: Int!
  total: Int!
}

enum NotifyAudience {
  actor
  assignee
  creator
  watchers
}

"""The virtual office: who is where, and how they show"""
type Office {
  people: [OfficePerson!]!
  workspaceId: ID!
