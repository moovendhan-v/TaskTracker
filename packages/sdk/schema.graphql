  name: String
}

type Workspace {
  color: String!
  createdAt: String!
  id: ID!
  name: String!

  """The caller's permissions, e.g. task.create"""
  permissions: [String!]!

  """The caller's role in this workspace"""
  roleName: String!
}

"""Something changed. Ids only: refetch the affected views to see it."""
type WorkspaceEvent {
  actorId: ID!
  entityId: ID!
  entityType: RealtimeEntityType!
  occurredAt: String!

  """e.g. task.updated"""
  type: String!
}

type WorkspaceTab {
  id: String!
  path: String!
  pinned: Boolean!
  title: String!
}

input WorkspaceTabInput {
  id: String!
  path: String!
  pinned: Boolean! = false
  title: String!
}
