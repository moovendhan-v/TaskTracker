type Query {
  """Platform-wide audit log with IP addresses"""
  adminAuditLog(
    action: String
    actorId: ID
    page: Int

    """1 to 100"""
    pageSize: Int
    workspaceId: ID
  ): AuditLogPage!
  adminUsers(
    page: Int

    """1 to 100"""
    pageSize: Int
    search: String
  ): AdminUserPage!
  adminWorkspaces(
    page: Int

    """1 to 100"""
    pageSize: Int
    search: String
  ): AdminWorkspacePage!

  """Unfinished tasks in a space that aren't in a sprint"""
  backlog(spaceId: ID!, workspaceId: ID!): [Task!]!
  comments(taskId: ID!, workspaceId: ID!): [Comment!]!
  departments(workspaceId: ID!): [Department!]!
  document(documentId: ID!, workspaceId: ID!): Document!

  """Page tree without content"""
  documents(
    """Matches page titles"""
    search: String
    workspaceId: ID!
  ): [DocumentSummary!]!
  employee(userId: ID!, workspaceId: ID!): Employee!

  """Current members with their HR profiles"""
  employees(workspaceId: ID!): [Employee!]!

  """Validation rules for the named forms, or all of them"""
  formSchemas(names: [String!]): [FormSchema!]!

  """Approver queue, oldest first"""
  leaveRequests(
    page: Int

    """1 to 100"""
    pageSize: Int
    status: LeaveStatus
    workspaceId: ID!
  ): LeaveRequestPage!
  leaveTypes(workspaceId: ID!): [LeaveType!]!

  """Every list in the workspace"""
  lists(workspaceId: ID!): [TaskList!]!

  """The signed-in user"""
  me: CurrentUser!
  members(workspaceId: ID!): [Member!]!

  """
  The caller's effective permissions and readable fields in the workspace
  """
  myAccess(workspaceId: ID!): MyAccess!
  myLeaveBalances(
    workspaceId: ID!

    """2000 to 2100; defaults to this year"""
    year: Int
  ): [LeaveBalance!]!
  myLeaveRequests(workspaceId: ID!): [LeaveRequest!]!

  """
  The signed-in user's settings, with defaults for anything never changed
  """
  myPreferences: Preferences!

  """Your notifications in this workspace, newest first"""
  notifications(
    page: Int

    """1 to 100"""
    pageSize: Int
    unreadOnly: Boolean
    workspaceId: ID!
  ): NotificationPage!

  """Managed and custom policies, with how many roles use each"""
  policies(workspaceId: ID!): [Policy!]!

  """Data fields whose visibility policies control"""
  protectedFields(workspaceId: ID!): [FieldDefinition!]!

  """Resources the caller can list with resourceSchema"""
  resourceNames(workspaceId: ID!): [String!]!

  """
  Fields, filter operators, sorting and paging a resource supports, for building tables and filters
  """
  resourceSchema(resource: String!, workspaceId: ID!): ResourceSchema!
  roles(workspaceId: ID!): [Role!]!

  """
  Members matching filters, sort and paging; see resourceSchema(resource: "members")
  """
  searchMembers(query: ResourceQueryInput, workspaceId: ID!): MemberPage!

  """
  Tasks matching filters, sort and paging; see resourceSchema(resource: "tasks"). Optionally limited to a list or a space.
  """
  searchTasks(listId: ID, query: ResourceQueryInput, spaceId: ID, workspaceId: ID!): TaskPage!

  """
  Audit entries matching filters; see resourceSchema(resource: "audit_log")
  """
  searchWorkspaceAuditLog(query: ResourceQueryInput, workspaceId: ID!): AuditLogPage!
  spaces(workspaceId: ID!): [Space!]!
  sprint(sprintId: ID!, workspaceId: ID!): Sprint!
  sprintTasks(sprintId: ID!, workspaceId: ID!): [Task!]!
  sprints(spaceId: ID!, workspaceId: ID!): [Sprint!]!
  task(taskId: ID!, workspaceId: ID!): Task!
  tasks(
    listId: ID!
    page: Int

    """1 to 100"""
    pageSize: Int
    search: String
    status: TaskStatus
    workspaceId: ID!
  ): TaskPage!
  unreadNotificationCount(workspaceId: ID!): Int!
  workspace(workspaceId: ID!): Workspace!

  """This workspace’s audit log, newest first, without IP addresses"""
  workspaceAuditLog(
    """
    Prefix of the action name, e.g. "hr."
    """
    action: String
    actorId: ID
    page: Int

    """1 to 100"""
    pageSize: Int
    workspaceId: ID!
  ): AuditLogPage!

  """Workspaces the caller belongs to"""
  workspaces: [Workspace!]!
}

