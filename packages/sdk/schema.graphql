type LayoutItem {
  config: BlockConfig
  h: Int!
  id: String!

  """Pinned by the workspace default: it stays where it is for everyone"""
  pinned: Boolean

  """Other blocks stacked in this slot, as tabs"""
  tabs: [String!]
  type: String!
  w: Int!
  x: Int!
  y: Int!
}

input LayoutItemInput {
  config: BlockConfigInput

  """
  Rows; sections may be 1, other blocks at least 2 (checked by the layout rules)
  """
  h: Int!
  id: String!

  """
  In a workspace default: pinned for everyone. Only layout managers set it; it is ignored in other people's saves
  """
  pinned: Boolean
  tabs: [String!]
  type: String!
  w: Int!
  x: Int!
  y: Int!
}

"""One of your recent saves of a page"""
type LayoutVersion {
  items: [LayoutItem!]!
  savedAt: String!
  version: Int!
}

type LeaveBalance {
