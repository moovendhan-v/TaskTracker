"""
A GitHub event that would have moved a task someone moved by hand in TaskFlow; sync waits for a person to settle it
"""
type GithubSyncConflict {
  createdAt: String!

  """open, merged or closed"""
  event: String!
  id: ID!
  prNumber: Int!
  prTitle: String!
  prUrl: String!
  taskId: ID!

  """The status the mapping would have set"""
  wantedStatus: GithubConflictStatus!
}

"""What one webhook delivery did"""
type GithubSyncEvent {
  connectionId: ID!
  createdAt: String!
  detail: String!
  event: String!
  id: ID!

  """ok, ignored or error"""
  outcome: String!
  prNumber: Int
  taskNumbers: [Int!]!
}

input GithubSyncInput {
  onClosed: StatusCategory
  onMerged: StatusCategory
  onOpened: StatusCategory
}

