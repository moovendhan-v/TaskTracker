  leaveTypeId: ID!
  leaveTypeName: String!
  pendingDays: Int!
  remainingDays: Int
  usedDays: Int!
  year: Int!
}

enum LeaveDecision {
  approved
  rejected
}

type LeaveRequest {
  createdAt: String!

  """Working days"""
