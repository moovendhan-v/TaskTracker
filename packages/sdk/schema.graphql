type Mutation {
  addMember(input: AddMemberInput!, workspaceId: ID!): AddMemberResult!
  attachRolePolicy(
    """managed:<key> or a custom policy id"""
    policy: String!
    roleId: ID!
    workspaceId: ID!
  ): Role!
  cancelLeaveRequest(requestId: ID!, workspaceId: ID!): LeaveRequest!

  """
  Unfinished tasks move to another planned sprint in the space, or to the backlog when omitted
  """
  completeSprint(moveOpenTasksToSprintId: ID, sprintId: ID!, workspaceId: ID!): Sprint!
  createComment(input: CommentInput!, taskId: ID!, workspaceId: ID!): Comment!
  createDepartment(input: CreateDepartmentInput!, workspaceId: ID!): Department!
  createDocument(input: CreateDocumentInput!, workspaceId: ID!): Document!
  createLeaveType(input: CreateLeaveTypeInput!, workspaceId: ID!): LeaveType!
  createList(input: TaskListInput!, spaceId: ID!, workspaceId: ID!): TaskList!
  createPolicy(input: SavePolicyInput!, workspaceId: ID!): Policy!
  createRole(input: CreateRoleInput!, workspaceId: ID!): Role!
  createSpace(input: CreateSpaceInput!, workspaceId: ID!): Space!
  createSprint(input: CreateSprintInput!, spaceId: ID!, workspaceId: ID!): Sprint!
  createTask(input: CreateTaskInput!, listId: ID!, workspaceId: ID!): Task!
  createWorkspace(input: CreateWorkspaceInput!): Workspace!

  """Approvers cannot decide on their own requests"""
  decideLeaveRequest(input: DecideLeaveInput!, requestId: ID!, workspaceId: ID!): LeaveRequest!

  """The author, or anyone with task.delete"""
  deleteComment(commentId: ID!, workspaceId: ID!): Boolean!
  deleteDepartment(departmentId: ID!, workspaceId: ID!): Boolean!

  """Sub-pages are deleted too"""
  deleteDocument(documentId: ID!, workspaceId: ID!): Boolean!
  deleteLeaveType(leaveTypeId: ID!, workspaceId: ID!): Boolean!
  deleteList(listId: ID!, workspaceId: ID!): Boolean!
  deletePolicy(policyId: ID!, workspaceId: ID!): Boolean!
  deleteRole(roleId: ID!, workspaceId: ID!): Boolean!
  deleteSpace(spaceId: ID!, workspaceId: ID!): Boolean!
  deleteSprint(sprintId: ID!, workspaceId: ID!): Boolean!
  deleteTask(taskId: ID!, workspaceId: ID!): Boolean!
  deleteView(viewId: ID!): Preferences!
  deleteWorkspace(workspaceId: ID!): Boolean!
  detachRolePolicy(
    """managed:<key> or a custom policy id"""
    policy: String!
    roleId: ID!
    workspaceId: ID!
  ): Role!

  """Leave a workspace. The last owner cannot leave."""
  leaveWorkspace(workspaceId: ID!): Boolean!

  """Returns how many were unread"""
  markAllNotificationsRead(workspaceId: ID!): Int!

  """Returns how many were unread"""
  markNotificationsRead(ids: [ID!]!, workspaceId: ID!): Int!

  """parentId null moves the page to the top level"""
  moveDocument(documentId: ID!, parentId: ID, position: Float, workspaceId: ID!): Document!
  removeMember(userId: ID!, workspaceId: ID!): Boolean!
  requestLeave(input: RequestLeaveInput!, workspaceId: ID!): LeaveRequest!

  """Back to the default settings"""
  resetPreferences: Preferences!
  resetTableLayout(key: String!): Preferences!

  """Saves how a table is arranged (columns, widths, paging)"""
  saveTableLayout(input: TableLayoutInput!): Preferences!

  """Creates or updates a saved view (a named set of filters)"""
  saveView(input: SaveViewInput!): Preferences!

  """
  Replaces a role's inline policy (statements that belong to that role only)
  """
  setRoleInlinePolicy(document: PolicyDocumentInput!, roleId: ID!, workspaceId: ID!): Role!

  """Replaces the open tabs of the multi-tab workspace"""
  setTabs(input: SetTabsInput!): Preferences!
  startSprint(sprintId: ID!, workspaceId: ID!): Sprint!

  """
  Suspending signs the user out everywhere. You cannot change your own account.
  """
  updateAdminUser(input: UpdateAdminUserInput!, userId: ID!): AdminUser!

  """Only the author can edit"""
  updateComment(commentId: ID!, input: CommentInput!, workspaceId: ID!): Comment!
  updateDepartment(departmentId: ID!, input: UpdateDepartmentInput!, workspaceId: ID!): Department!
  updateDocument(documentId: ID!, input: UpdateDocumentInput!, workspaceId: ID!): Document!
  updateLeaveType(input: UpdateLeaveTypeInput!, leaveTypeId: ID!, workspaceId: ID!): LeaveType!
  updateList(input: TaskListInput!, listId: ID!, workspaceId: ID!): TaskList!
  updateMemberRole(roleId: ID!, userId: ID!, workspaceId: ID!): Member!
  updatePolicy(input: SavePolicyInput!, policyId: ID!, workspaceId: ID!): Policy!
  updatePreferences(input: UpdatePreferencesInput!): Preferences!
  updateRole(input: UpdateRoleInput!, roleId: ID!, workspaceId: ID!): Role!
  updateSpace(input: UpdateSpaceInput!, spaceId: ID!, workspaceId: ID!): Space!
  updateSprint(input: UpdateSprintInput!, sprintId: ID!, workspaceId: ID!): Sprint!
  updateTask(input: UpdateTaskInput!, taskId: ID!, workspaceId: ID!): Task!
  updateWorkspace(input: UpdateWorkspaceInput!, workspaceId: ID!): Workspace!
  upsertEmployeeProfile(input: EmployeeProfileInput!, userId: ID!, workspaceId: ID!): Employee!
}

