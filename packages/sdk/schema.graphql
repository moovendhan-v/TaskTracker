type Mutation {
  addChatChannelMembers(channelId: ID!, userIds: [ID!]!, workspaceId: ID!): [ChatMember!]!
  addMember(input: AddMemberInput!, workspaceId: ID!): AddMemberResult!
  archiveChatChannel(archived: Boolean! = true, channelId: ID!, workspaceId: ID!): ChatChannel!
  attachRolePolicy(
    """managed:<key> or a custom policy id"""
    policy: String!
    roleId: ID!
    workspaceId: ID!
  ): Role!
  cancelLeaveRequest(requestId: ID!, workspaceId: ID!): LeaveRequest!

  """
  Tells the channel you are typing. A live signal only; nothing is stored
  """
  chatTyping(channelId: ID!, workspaceId: ID!): Boolean!

  """
  Back to the built-in default for everyone who has not arranged the page (audited)
  """
  clearWorkspaceLayout(pageKey: String!, workspaceId: ID!): Boolean!
  clockIn(workspaceId: ID!): AttendanceShift!

  """Ends your shift, and a running break with it"""
  clockOut(workspaceId: ID!): AttendanceShift!

  """
  Checks an uploaded file (size, real type). Files that fail are deleted and the reason returned
  """
  completeChatUpload(attachmentId: ID!, workspaceId: ID!): ChatUploadResult!

  """
  Unfinished tasks move to another planned sprint in the space, or to the backlog when omitted
  """
  completeSprint(
    moveOpenTasksToSprintId: ID

    """Per-task destinations for unfinished tasks"""
    rollover: CompleteSprintMovesInput
    sprintId: ID!
    workspaceId: ID!
