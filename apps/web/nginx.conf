# Serves the built SPA and proxies /api to the API container, so the browser
# talks to one origin and session cookies stay first-party.
# "upgrade" for WebSocket handshakes, "close" otherwise (plain requests keep the old behaviour).
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  absolute_redirect off;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  # Live updates: GraphQL subscriptions over a WebSocket. Long-lived, so no 30s read timeout.
  location = /api/graphql {
    include /tmp/nginx-snippets/security-headers.conf;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  # Chat file uploads: up to 10 MB, streamed straight to the API (which checks size and type).
  location ^~ /api/storage/uploads/ {
    include /tmp/nginx-snippets/security-headers.conf;
    client_max_body_size 11m;
    proxy_request_buffering off;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /api/ {
    include /tmp/nginx-snippets/security-headers.conf;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # The installable app (F1): the service worker is always checked for updates, and the
  # manifest goes out with its own type.
  location = /sw.js {
    include /tmp/nginx-snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    include /tmp/nginx-snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    types { }
    default_type application/manifest+json;
  }

  # The embeddable feedback widget (E6.3): loaded by <script> tags on customers' sites.
  location /embed/ {
    include /tmp/nginx-snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=300";
    add_header Cross-Origin-Resource-Policy "cross-origin";
    try_files $uri =404;
  }

  # The browser extension (E6.3): /downloads/extension/latest picks the package for the browser
  # asking (Firefox gets the Firefox build, every other browser the Chrome/Edge one); ?browser=
  # chrome|firefox overrides it. The zips download as attachments.
  location = /downloads/extension/latest {
    include /tmp/nginx-snippets/security-headers.conf;
    set $extension_browser chrome;
    if ($http_user_agent ~* "(Firefox|FxiOS)/") { set $extension_browser firefox; }
    if ($arg_browser = "firefox") { set $extension_browser firefox; }
    if ($arg_browser = "chrome") { set $extension_browser chrome; }
    add_header Cache-Control "no-store";
    return 302 /downloads/extension/taskflow-extension-$extension_browser.zip;
  }

  location /downloads/extension/ {
    include /tmp/nginx-snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    add_header Content-Disposition "attachment";
    types { application/zip zip; application/json json; }
    try_files $uri =404;
  }

  location /assets/ {
    include /tmp/nginx-snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    include /tmp/nginx-snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
