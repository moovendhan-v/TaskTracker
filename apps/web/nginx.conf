# Serves the built SPA and proxies /api to the API container, so the browser
# talks to one origin and session cookies stay first-party.
# "upgrade" for WebSocket handshakes, "close" otherwise (plain requests keep the old behaviour).
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  # Live updates: GraphQL subscriptions over a WebSocket. Long-lived, so no 30s read timeout.
  location = /api/graphql {
    include /tmp/nginx-snippets/security-headers.conf;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  # Chat file uploads: up to 10 MB, streamed straight to the API (which checks size and type).
  location ^~ /api/storage/uploads/ {
    include /tmp/nginx-snippets/security-headers.conf;
    client_max_body_size 11m;
    proxy_request_buffering off;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /api/ {
    include /tmp/nginx-snippets/security-headers.conf;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # The installable app (F1): the service worker is always checked for updates, and the
  # manifest goes out with its own type.
  location = /sw.js {
    include /tmp/nginx-snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    include /tmp/nginx-snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    types { }
    default_type application/manifest+json;
  }

  location /assets/ {
    include /tmp/nginx-snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    include /tmp/nginx-snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
