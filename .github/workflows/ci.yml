# Every third-party action is pinned to a full commit SHA (AGENTS.md: supply chain).
# Dependabot (.github/dependabot.yml) proposes updates, with the version in the trailing comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - name: Generated SDK is up to date
        run: |
          pnpm sdk:generate
          git diff --exit-code -- packages/sdk || (echo "::error::Run 'pnpm sdk:generate' and commit the result." && exit 1)
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (API and browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          # Throwaway database for this job only. The tests themselves connect as the two
          # least-privilege roles created below, never as this superuser.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # Throwaway cache for this job. The API e2e suite runs against it (E2E_REDIS_URL).
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create the test database with the same roles as Docker
        run: |
          owner_password=$(openssl rand -hex 24)
          app_password=$(openssl rand -hex 24)
          echo "::add-mask::$owner_password"
          echo "::add-mask::$app_password"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE taskflow_test'
          PGHOST=localhost POSTGRES_USER=postgres POSTGRES_DB=taskflow_test \
            APP_DB_OWNER=taskflow_owner APP_DB_OWNER_PASSWORD="$owner_password" \
            APP_DB_USER=taskflow_app APP_DB_PASSWORD="$app_password" \
            sh infra/docker/postgres/01-app-role.sh
          echo "E2E_DATABASE_URL=postgres://taskflow_app:$app_password@localhost:5432/taskflow_test" >> "$GITHUB_ENV"
          echo "E2E_MIGRATION_DATABASE_URL=postgres://taskflow_owner:$owner_password@localhost:5432/taskflow_test" >> "$GITHUB_ENV"

      - name: API end-to-end tests
        run: pnpm --filter @taskflow/api test:e2e
        env:
          E2E_REDIS_URL: redis://localhost:6379/0

      - name: Install Chromium for Playwright
        run: pnpm --filter @taskflow/web exec playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: pnpm --filter @taskflow/web test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  infra:
    name: Infrastructure config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Terraform format and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Docker Compose config is valid
        run: |
          sed -E 's/^(POSTGRES_PASSWORD|APP_DB_OWNER_PASSWORD|APP_DB_PASSWORD|BETTER_AUTH_SECRET|REDIS_PASSWORD)=$/\1=ci-placeholder/' .env.example > "$RUNNER_TEMP/compose.env"
          docker compose -f infra/docker/docker-compose.yml --env-file "$RUNNER_TEMP/compose.env" config --quiet
