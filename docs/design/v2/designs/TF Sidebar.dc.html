<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:232px;height:100%;box-sizing:border-box;border-right:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;padding:10px 8px;gap:2px;font-family:Geist,system-ui,sans-serif;font-size:12.5px;color:var(--ink)">
  <div style="height:30px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-weight:500;margin-bottom:8px"><i style="font-size:16px">add</i>Quick add<span style="margin-left:auto;font:11px 'Geist Mono',monospace;opacity:.7">Q</span></div>
  <sc-for list="{{ top }}" as="n" hint-placeholder-count="5"><div style="height:30px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:6px;color:{{ n.c }};background:{{ n.bg }};font-weight:{{ n.w }}"><i style="font-size:17px">{{ n.i }}</i>{{ n.n }}<span style="margin-left:auto;font:500 11px 'Geist Mono',monospace;color:var(--ink3)">{{ n.b }}</span></div></sc-for>
  <div style="font:600 10.5px 'Geist Mono',monospace;letter-spacing:.06em;color:var(--ink3);padding:14px 8px 4px">SPACES</div>
  <sc-for list="{{ spaces }}" as="n" hint-placeholder-count="6"><div style="height:30px;display:flex;align-items:center;gap:8px;padding:0 8px 0 {{ n.pad }};border-radius:6px;color:{{ n.c }};background:{{ n.bg }};font-weight:{{ n.w }}"><i style="font-size:16px;color:var(--ink3)">{{ n.i }}</i>{{ n.n }}</div></sc-for>
  <div style="font:600 10.5px 'Geist Mono',monospace;letter-spacing:.06em;color:var(--ink3);padding:14px 8px 4px">WORKSPACE</div>
  <sc-for list="{{ ws }}" as="n" hint-placeholder-count="5"><div style="height:30px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:6px;color:{{ n.c }};background:{{ n.bg }};font-weight:{{ n.w }}"><i style="font-size:16px;color:var(--ink3)">{{ n.i }}</i>{{ n.n }}</div></sc-for>
  <div style="flex:1"></div>
  <div style="border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:var(--green)"></span>5 online<span style="margin-left:auto;font-weight:400;color:var(--ink3)">Office →</span></div>
    <div style="display:flex"><sc-for list="{{ ppl }}" as="p" hint-placeholder-count="5"><span style="width:22px;height:22px;border-radius:50%;background:{{ p.c }};color:#fff;font-size:9px;font-weight:600;display:grid;place-items:center;border:2px solid var(--surface);margin-right:-5px">{{ p.i }}</span></sc-for></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:852},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;mytasks&quot;,&quot;inbox&quot;,&quot;dash&quot;,&quot;docs&quot;,&quot;platform&quot;,&quot;backend&quot;,&quot;web&quot;,&quot;sprint&quot;,&quot;auto&quot;,&quot;github&quot;,&quot;templates&quot;,&quot;people&quot;,&quot;admin&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const it = (k,i,n,b='',pad='8px') => ({i,n,b,pad,c:k===a?'var(--ink)':'var(--ink2)',bg:k===a?'var(--sunk)':'transparent',w:k===a?500:400});
    return {
      top:[it('home','home','Home'),it('mytasks','check_circle','My tasks','9'),it('inbox','inbox','Inbox','4'),it('dash','monitoring','Dashboards'),it('docs','article','Docs')],
      spaces:[{...it('platform','expand_more','Platform'),c:'var(--ink)',w:500},it('backend','list','Backend','','28px'),it('web','list','Web','','28px'),it('sprint','sprint','Sprint 14','','28px'),it('design','chevron_right','Design'),it('ops','chevron_right','Ops desk')],
      ws:[it('auto','bolt','Automations'),it('github','merge','GitHub'),it('templates','grid_view','Templates'),it('people','badge','People & time'),it('admin','admin_panel_settings','Admin')],
      ppl:[{i:'MC',c:'#5B7A6E'},{i:'DP',c:'#5D6B8A'},{i:'LO',c:'#8C6B47'},{i:'AT',c:'#4F6F7A'},{i:'TS',c:'#7A6A58'}]
    };
  }
}
</script>
</body>
</html>
