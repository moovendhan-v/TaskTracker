# Local TaskFlow stack. Run from the repo root:
#   cp .env.example .env   # then fill in the secrets
#   pnpm infra:up          # http://localhost:8080
name: taskflow

x-api-env: &api-env
  NODE_ENV: production
  PORT: "3000"
  # Runtime role: data only, subject to row-level security.
  DATABASE_URL: postgres://${APP_DB_USER:-taskflow_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-taskflow}
  DATABASE_SSL: "false"
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  # The browser reaches the API through the web container's /api proxy, so both share one origin.
  BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:8080}
  CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
  TRUST_PROXY: "1"
  # Production builds require a CAPTCHA. The default is Cloudflare's public test secret, which
  # always passes; set your own keys for a real deployment.
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
  # Production builds require outgoing mail. The default sends to the local Mailpit inbox
  # (http://localhost:8025); point SMTP_URL at a real provider for a real deployment.
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-TaskFlow <no-reply@taskflow.localhost>}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  # Uploads go to the private MinIO bucket below (S3-compatible). For AWS S3 or R2, point these at it instead.
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_FORCE_PATH_STYLE: "true"
  S3_REGION: us-east-1
  S3_BUCKET: ${MINIO_BUCKET:-taskflow-uploads}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-taskflow}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  # Calls (D2): empty unless a LiveKit server is configured.
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  LIVEKIT_SERVER_URL: ${LIVEKIT_SERVER_URL:-}

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      APP_DB_OWNER: ${APP_DB_OWNER:-taskflow_owner}
      APP_DB_OWNER_PASSWORD: ${APP_DB_OWNER_PASSWORD:?set APP_DB_OWNER_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-taskflow_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    # Bound to loopback only, for local tools such as psql. Remove to keep the database fully private.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  # Shared cache. Memory only (no snapshots), password protected, reachable only on the backend network.
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    read_only: true
    tmpfs: [/data]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  # Local inbox for password reset emails. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    read_only: true
    # Mailpit keeps its message store in a temporary file, deleted on exit.
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  # S3-compatible object storage for uploads. Private: only the backend network reaches the API port;
  # the console is on localhost for inspection.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-taskflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  # Creates the uploads bucket once, with no anonymous access.
  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-taskflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-taskflow-uploads}
    entrypoint:
      - sh
      - -c
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$MINIO_BUCKET" && mc anonymous set none "local/$$MINIO_BUCKET"
    restart: "no"
    networks: [backend]

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: taskflow-api:local
    command: ["node", "dist/cli/run-migrations.js"]
    environment:
      <<: *api-env
      # Only the migrate job gets the owner role, which can change the schema.
      MIGRATION_DATABASE_URL: postgres://${APP_DB_OWNER:-taskflow_owner}:${APP_DB_OWNER_PASSWORD:?set APP_DB_OWNER_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-taskflow}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    image: taskflow-api:local
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        # Cloudflare's public test site key by default (pairs with the test secret above).
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
    image: taskflow-web:local
    restart: unless-stopped
    environment:
      # Lets the page connect to the calls media server (CSP connect-src); empty when calls are off.
      LIVEKIT_CONNECT_SRC: ${LIVEKIT_URL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

volumes:
  pgdata:
  miniodata:

networks:
  backend:
